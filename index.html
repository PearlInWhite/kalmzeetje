<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalm Zeetje</title>
<meta name="description" content="Kalm Zeetje — thuishaven van Gehoest, Wetbeter en andere projecten.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6EEE8; --ink:#1E2440; --muted:#5A5670; --tile:#EADCD2; --line:#D8C6BC; --hover:#A8441F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
main{padding-top:112px;padding-bottom:96px;display:flex;flex-direction:column;gap:96px}
.intro{display:flex;flex-direction:column;gap:24px}
.mark{width:160px;height:120px}
h1{margin:0;font-family:Sora,sans-serif;font-weight:500;font-size:clamp(44px,7vw,88px);line-height:1;letter-spacing:-0.04em}
.tagline{margin:0;font-size:20px;line-height:1.5;color:var(--muted);max-width:32ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr));gap:72px 40px}
.project{display:flex;flex-direction:column;gap:24px;text-decoration:none}
.project .img{width:100%;aspect-ratio:4/3;border-radius:24px;background:var(--tile);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.project .img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.project:hover .img img{transform:scale(1.02)}
.meta{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.meta div{display:flex;flex-direction:column;gap:6px}
.name{font-family:Sora,sans-serif;font-weight:500;font-size:clamp(28px,3vw,40px);letter-spacing:-0.03em}
.slogan{font-size:16px;line-height:1.45;font-style:italic;color:#A8441F;max-width:44ch}
.arrow{flex-shrink:0;margin-top:8px;transition:transform .2s ease,color .2s ease}
.project:hover .arrow{transform:translate(3px,-3px);color:var(--hover)}
.project:focus-visible{outline:2px solid var(--hover);outline-offset:8px;border-radius:24px}
footer{border-top:1px solid var(--line);padding:24px 0 48px;font-size:14px;color:var(--muted)}
@media (max-width:600px){main{padding-top:64px;gap:64px}.mark{width:120px;height:90px}}
</style>
</head>
<body>
<div class="wrap">
<main>

<header class="intro">
<svg class="mark" viewBox="0 0 96 72" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Kalm Zeetje zeilbootje"><path d="M0 46c6-2.5 12-2.5 18-0.5" stroke="#3E7A55"/><path d="M0 47h26M70 47h26" stroke="#646893" stroke-opacity="0.6"/><path d="M49 4l-1 45" stroke="#1E2440"/><path d="M49 5c10 10 13 27 10 44h-10" stroke="#D9653B"/><path d="M48 8c-8 13-12 27-13 42h11" stroke="#B8457A"/><path d="M32 51l30-2-4 6c-6 2-13 2.5-20 2z" stroke="#1E2440"/><path d="M34 62h14" stroke="#C9861A"/><path d="M54 62h10" stroke="#3C5BB0"/><path d="M26 65h10M58 65h12" stroke="#D9653B"/><path d="M40 65h14" stroke="#B8457A"/><path d="M30 68h7M60 68h16" stroke="#3C5BB0"/><path d="M45 68h7" stroke="#C9861A"/><path d="M17 71h21" stroke="#646893"/><path d="M44 71h28" stroke="#D9653B" stroke-opacity="0.75"/></svg>
<h1>Kalm Zeetje</h1>
<p class="tagline">Uitsluitend ontspannen projecten.</p>
</header>

<section class="grid" aria-label="Projecten">

<!-- Nieuw project: kopieer een <a class="project">-blok en pas link, afbeelding, naam en slogan aan. -->

<a class="project" href="https://gehoest.nl">
<div class="img"><img src="images/gehoest.jpg" alt="Gehoest: van technische tekening naar offerte" width="1600" height="1200" loading="lazy"></div>
<div class="meta">
<div><span class="name">Gehoest</span><span class="slogan">“Van technische tekening naar offerte in 5 minuten”</span></div>
<svg class="arrow" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
</div>
</a>

<a class="project" href="https://wetbeter.nl">
<div class="img"><img src="images/wetbeter.jpg" alt="Wetbeter: Weet jij het beter? Begrotingskaarten voor onderwijs, zorg en binnenlandse zaken" width="1600" height="1200" loading="lazy"></div>
<div class="meta">
<div><span class="name">Wetbeter</span><span class="slogan">“Hoe doe jij het beter? De miljarden staan klaar, schuif jouw begroting in elkaar”</span></div>
<svg class="arrow" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
</div>
</a>

</section>
</main>

<footer>© 2026 Kalm Zeetje</footer>
</div>
</body>
</html>
